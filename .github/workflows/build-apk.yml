name: 🏗️ Build Android APK

on:
  push:
    branches: [main, claude/apk-file-generation-fhr0fn]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Replace Android icons with custom icons
        run: |
          ICON="icon-512.png"
          ICON_ROUND="icon-512.png"
          RES="android/app/src/main/res"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dpi="mdpi"    ;;
              72)  dpi="hdpi"    ;;
              96)  dpi="xhdpi"   ;;
              144) dpi="xxhdpi"  ;;
              192) dpi="xxxhdpi" ;;
            esac
            mkdir -p "$RES/mipmap-$dpi"
            convert "$ICON"      -resize ${size}x${size} "$RES/mipmap-$dpi/ic_launcher.png"
            convert "$ICON_ROUND" -resize ${size}x${size} "$RES/mipmap-$dpi/ic_launcher_round.png"
          done
          # foreground for adaptive icon (larger canvas)
          mkdir -p "$RES/mipmap-anydpi-v26"
          convert "$ICON" -resize 108x108 "$RES/drawable/ic_launcher_foreground.png" 2>/dev/null || true

      # ── Debug APK (للتجربة الشخصية) ──────────────────────────
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: مالي-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release APK (للبلاي ستور) ────────────────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/malii-release.keystore

      - name: Build Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/malii-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: مالي-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "### نتائج البناء 🚀" >> $GITHUB_STEP_SUMMARY
          DEBUG="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$DEBUG" ] && echo "✅ Debug APK: $(du -sh $DEBUG | cut -f1)" >> $GITHUB_STEP_SUMMARY
          [ -f "$RELEASE" ] && echo "✅ Release APK: $(du -sh $RELEASE | cut -f1)" >> $GITHUB_STEP_SUMMARY
