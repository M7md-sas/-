name: Build Android APK

on:
  push:
    branches: [main, claude/apk-file-generation-fhr0fn]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Fix app icon
        run: |
          pip install Pillow -q
          python3 - << 'PYEOF'
import os, shutil
from PIL import Image

img = Image.open("icon-512.png").convert("RGBA")
res = "android/app/src/main/res"

# استبدال جميع أحجام الأيقونة
for dpi, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
    d = f"{res}/mipmap-{dpi}"
    os.makedirs(d, exist_ok=True)
    r = img.resize((size, size), Image.LANCZOS)
    r.save(f"{d}/ic_launcher.png")
    r.save(f"{d}/ic_launcher_round.png")

# حذف Adaptive Icons تماماً — يجبر أندرويد على استخدام PNG
anydpi = f"{res}/mipmap-anydpi-v26"
if os.path.exists(anydpi):
    shutil.rmtree(anydpi)

print("Done: custom icon applied!")
PYEOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: malii-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore configured, skipping release build"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/malii-release.keystore
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/malii-release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        with:
          name: malii-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
